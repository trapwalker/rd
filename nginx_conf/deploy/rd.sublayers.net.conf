# Vhost for the *host-level* shared nginx-proxy (managed outside this repo,
# see ~/nginx/docker-compose.yml + ~/nginx/sites/ on the VDS - same pattern
# as shop1.sublayers.net.conf and trillink.sublayers.net.conf there).
#
# This is a thin TLS-terminating reverse proxy in front of this project's
# own `nginx` container (docker-compose.yml service `nginx`,
# container_name: rd_nginx), which does the real routing to
# game-engine/site-server/quick-engine and serves static/tiles/audio - see
# nginx_conf/templates/rd.conf.template. The shared proxy just needs to
# reach that one container over the external `rd_web` docker network:
#
#   docker network create rd_web   # once per host
#   # then add `rd_web` to this project's `nginx` service networks
#   # (already done in docker-compose.prod.yml) and to the shared
#   # nginx-proxy's own compose file (external: true) so both sides
#   # can resolve `rd_nginx` by name.
#
# Deploy: copy this file to ~/nginx/sites/rd.sublayers.net.conf on the host,
# then `certbot certonly --webroot -w /var/certbot -d rd.sublayers.net`
# before enabling the HTTPS server block below, and reload the shared
# nginx-proxy container.

server {
    listen 80;
    server_name rd.sublayers.net;

    location /.well-known/acme-challenge/ {
        root /var/certbot;
    }

    location / {
        return 301 https://rd.sublayers.net$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name rd.sublayers.net;

    ssl_certificate     /etc/letsencrypt/live/rd.sublayers.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rd.sublayers.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # sendfile causes large file transfer hangs in Docker on KVM/QEMU
    # (same issue as sublayers.net.conf / shop1.sublayers.net.conf).
    sendfile off;
    client_max_body_size 20m;

    access_log /var/log/nginx/rd.sublayers.net-access.log;
    error_log  /var/log/nginx/rd.sublayers.net-error.log;

    # Docker DNS: resolve the container name dynamically so this vhost
    # survives `rd_nginx` being recreated (redeploys) without a reload.
    resolver 127.0.0.11 valid=10s;
    set $rd http://rd_nginx;

    location / {
        proxy_pass $rd;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Game websocket endpoints (/ws, /quick/ws) are proxied through
        # rd_nginx behind this - upgrade headers must pass through both hops.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 180s;
    }
}
