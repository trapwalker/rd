<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Road Dogs{% endblock %}</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    {% block head %}{% endblock %}
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }

        header {
            background-color: #2a2a2a;
            padding: 20px 0;
            border-bottom: 2px solid #ff6b00;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff6b00;
        }

        footer {
            background-color: #2a2a2a;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #444;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">🚗 Road Dogs</div>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 Road Dogs. All rights reserved.</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
