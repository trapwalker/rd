<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Statistics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #0f0;
            padding: 20px;
        }
        h1 {
            color: #0f0;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #0f0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a1a;
            border: 2px solid #0f0;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #0f0;
        }
        th {
            background: #0a0a0a;
            color: #0f0;
            font-weight: bold;
        }
        tr:hover {
            background: #0f0;
            color: #000;
        }
        .empty {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>🎯 Event Statistics</h1>

    {% if events_metrics %}
    <table>
        <thead>
            <tr>
                <th>Event Type</th>
                <th>Count</th>
                <th>Total Time (ms)</th>
                <th>Avg Time (ms)</th>
            </tr>
        </thead>
        <tbody>
            {% for event in events_metrics %}
            <tr>
                <td>{{ event.type }}</td>
                <td>{{ event.count }}</td>
                <td>{{ event.total_time }}</td>
                <td>{{ event.avg_time }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <div class="empty">No event statistics available</div>
    {% endif %}
</body>
</html>
