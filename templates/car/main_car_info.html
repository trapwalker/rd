<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Info</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }
        .car-info {
            max-width: 700px;
            margin: 0 auto;
            background: #2a2a2a;
            border: 2px solid #ff6b00;
            border-radius: 10px;
            padding: 30px;
        }
        h1 {
            color: #ff6b00;
            margin-bottom: 20px;
        }
        p {
            color: #999;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="car-info">
        <h1>🚗 Car Information</h1>
        <p>Detailed car information will be displayed here.</p>
        <p style="margin-top: 10px; color: #666;">Note: This handler is likely not used.</p>
    </div>
</body>
</html>
