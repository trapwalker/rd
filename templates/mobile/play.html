<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Road Dogs - Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            touch-action: manipulation;
        }

        #mobile-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #mobile-header {
            background-color: #1a1a1a;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff6b00;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #ff6b00;
        }

        #mobile-game {
            flex: 1;
            background-color: #111111;
            position: relative;
        }

        #mobile-controls {
            background-color: #1a1a1a;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            border-top: 1px solid #333;
        }

        .control-button {
            background-color: #2a2a2a;
            border: 2px solid #ff6b00;
            color: #ffffff;
            padding: 15px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            active: scale(0.95);
        }

        .control-button:active {
            background-color: #ff6b00;
            transform: scale(0.95);
        }

        #joystick {
            position: absolute;
            bottom: 100px;
            left: 30px;
            width: 120px;
            height: 120px;
            background-color: rgba(42, 42, 42, 0.5);
            border: 2px solid #ff6b00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #joystick-stick {
            width: 50px;
            height: 50px;
            background-color: #ff6b00;
            border-radius: 50%;
            position: relative;
        }

        .status {
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 4px;
            background-color: #2a2a2a;
        }

        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-content {
            text-align: center;
        }

        .loading-icon {
            font-size: 60px;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="mobile-container">
        <!-- Header -->
        <div id="mobile-header">
            <div class="logo">🚗 Road Dogs</div>
            <div class="status" id="connection-status">Connecting...</div>
        </div>

        <!-- Game Area -->
        <div id="mobile-game">
            <div id="loading">
                <div class="loading-content">
                    <div class="loading-icon">🚗</div>
                    <div style="margin-top: 20px; color: #ff6b00;">Loading game...</div>
                </div>
            </div>

            <!-- Virtual Joystick -->
            <div id="joystick">
                <div id="joystick-stick"></div>
            </div>
        </div>

        <!-- Controls -->
        <div id="mobile-controls">
            <button class="control-button" onclick="action('shoot')">🎯 Shoot</button>
            <button class="control-button" onclick="action('brake')">🛑 Brake</button>
            <button class="control-button" onclick="action('inventory')">🎒 Inventory</button>
            <button class="control-button" onclick="action('map')">🗺️ Map</button>
        </div>
    </div>

    <script>
        // WebSocket connection
        let ws = null;
        const wsUrl = `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws`;

        function connect() {
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                document.getElementById('connection-status').textContent = 'Connected';
                document.getElementById('connection-status').style.backgroundColor = '#00ff00';
                document.getElementById('connection-status').style.color = '#000000';
                hideLoading();
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('Received:', data);
            };

            ws.onerror = (error) => {
                document.getElementById('connection-status').textContent = 'Error';
                document.getElementById('connection-status').style.backgroundColor = '#ff0000';
            };

            ws.onclose = () => {
                document.getElementById('connection-status').textContent = 'Disconnected';
                document.getElementById('connection-status').style.backgroundColor = '#666';
                setTimeout(connect, 2000);
            };
        }

        function hideLoading() {
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 1000);
        }

        function action(type) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'action', action: type }));
            }
        }

        // Joystick handling
        let joystickActive = false;
        const joystick = document.getElementById('joystick');
        const stick = document.getElementById('joystick-stick');

        joystick.addEventListener('touchstart', (e) => {
            e.preventDefault();
            joystickActive = true;
        });

        document.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            e.preventDefault();

            const touch = e.touches[0];
            const rect = joystick.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let deltaX = touch.clientX - centerX;
            let deltaY = touch.clientY - centerY;

            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxDistance = 35;

            if (distance > maxDistance) {
                deltaX = (deltaX / distance) * maxDistance;
                deltaY = (deltaY / distance) * maxDistance;
            }

            stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

            // Send movement to server
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'move',
                    direction: {
                        x: deltaX / maxDistance,
                        y: deltaY / maxDistance
                    }
                }));
            }
        });

        document.addEventListener('touchend', () => {
            joystickActive = false;
            stick.style.transform = 'translate(0, 0)';
        });

        // Initialize
        window.onload = () => {
            connect();
        };
    </script>
</body>
</html>
