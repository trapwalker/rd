<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ person.username if person else 'Unknown' }} - Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }
        .chat-window {
            max-width: 500px;
            margin: 0 auto;
            background: #2a2a2a;
            border: 2px solid #ff6b00;
            border-radius: 10px;
            padding: 20px;
        }
        h2 {
            color: #ff6b00;
            margin-bottom: 20px;
        }
        .chat-messages {
            height: 300px;
            background: #1a1a1a;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 15px;
            overflow-y: auto;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 5px;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 5px;
            color: #fff;
        }
        button {
            background: #ff6b00;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
        }
        button:hover {
            background: #ff8c33;
        }
    </style>
</head>
<body>
    <div class="chat-window">
        <h2>💬 Chat with {{ person.username if person else 'Unknown' }}</h2>
        <div class="chat-messages">
            <p style="color: #999; text-align: center;">Chat system will be implemented here</p>
        </div>
        <div class="input-area">
            <input type="text" placeholder="Type a message...">
            <button>Send</button>
        </div>
    </div>
</body>
</html>
