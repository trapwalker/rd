[project]
name = "roaddogs"
version = "0.2.0"
description = "Road Dogs Online Game"
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "tornado>=6.4",
    "cachetools>=5.3.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "mongoengine>=0.28.0",
    "psutil>=5.9.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "pymongo>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
rd = "cli.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_backend"

[tool.setuptools]
packages = ["cli", "sublayers_common", "sublayers_server", "sublayers_site", "sublayers_editor", "sublayers_admin", "tile_converter"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E722",  # bare except
    "F401",  # unused import (during migration)
]

[tool.pytest.ini_options]
testpaths = ["sublayers_server/model/tests"]
python_files = "test_*.py"
