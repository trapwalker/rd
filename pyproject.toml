[project]
name = "roaddogs"
version = "0.3.0"
description = "Road Dogs Online Game - FastAPI Edition"
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework (FastAPI stack)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.16",
    "jinja2>=3.1.0",
    "orjson>=3.10.0",

    # Database (Async MongoDB)
    "motor>=3.6.0",
    "beanie>=1.27.0",
    "pymongo>=4.6.0",

    # Data Validation & Serialization
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",

    # Utilities
    "cachetools>=5.3.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "psutil>=5.9.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "aiofiles>=24.0.0",
    "python-dateutil>=2.9.0",

    # Backward compatibility (temporary during migration)
    "tornado>=6.4",
    "mongoengine>=0.28.0",
    "six>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.1.0",
]

[project.scripts]
rd = "cli.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_backend"

[tool.setuptools]
packages = ["cli", "sublayers_common", "sublayers_server", "sublayers_site", "sublayers_editor", "sublayers_admin", "tile_converter"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E722",  # bare except
    "F401",  # unused import (during migration)
]

[tool.pytest.ini_options]
testpaths = ["sublayers_server/model/tests"]
python_files = "test_*.py"
