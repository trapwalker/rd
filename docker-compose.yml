version: '3.8'

services:
  # MongoDB database
  mongodb:
    image: mongo:7.0
    container_name: rd_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password
      MONGO_INITDB_DATABASE: rd
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - rd_network
    healthcheck:
      # mongosh is a Node.js client - cold-starting it for the check can take
      # several seconds under CPU contention (e.g. a single-vCPU host), well
      # past a 5s timeout, even though mongod itself is responsive.
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 15s
      retries: 5

  # Redis cache (for future use)
  redis:
    image: redis:7-alpine
    container_name: rd_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rd_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI application (development)
  app:
    build:
      context: .
      target: development
    container_name: rd_app
    restart: unless-stopped
    environment:
      - MONGODB_URL=mongodb://admin:admin_password@mongodb:27017/rd?authSource=admin
      - REDIS_URL=redis://redis:6379/0
      # No SECRET_KEY here on purpose: app/config.py's validator rejects this
      # exact placeholder string outright (blocks the literal
      # "your-secret-key-change-in-production" everywhere, not just prod),
      # so setting it crashed every dev container on startup. Leaving it
      # unset lets Settings.secret_key's default_factory auto-generate a
      # random one - fine for dev, where a fresh key each restart isn't a
      # problem.
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot-reload
      - ./app:/app/app
      - ./sublayers_common:/app/sublayers_common
      - ./tests:/app/tests
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rd_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # --- Legacy Tornado stack (being phased out, still the live game today) ---
  # Same image as `app` (development target = full source tree + full deps,
  # including tornado/mongoengine) - only the command differs per service.
  game-engine:
    build:
      context: .
      target: development
    container_name: rd_game_engine
    restart: unless-stopped
    working_dir: /app/sublayers_server
    environment:
      - GAME_ENGINE_PORT=${GAME_ENGINE_PORT:-8000}
    command: >
      python engine_server.py --mode=basic
      --port=${GAME_ENGINE_PORT:-8000}
      --ws_port=${GAME_ENGINE_PORT:-8000}
      --db=mongodb://admin:admin_password@mongodb:27017/rd?authSource=admin
      --map_link=/map
    volumes:
      - .:/app
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - rd_network

  site-server:
    build:
      context: .
      target: development
    container_name: rd_site_server
    restart: unless-stopped
    working_dir: /app/sublayers_site
    command: >
      python site_server.py
      --port=${SITE_PORT:-8001}
      --db=mongodb://admin:admin_password@mongodb:27017/rd?authSource=admin
    volumes:
      - .:/app
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - rd_network

  quick-engine:
    build:
      context: .
      target: development
    container_name: rd_quick_engine
    restart: unless-stopped
    working_dir: /app/sublayers_server
    command: >
      python engine_server_quick.py --mode=quick
      --port=${QUICK_PORT:-8005}
      --ws_port=${QUICK_PORT:-8005}
      --db=mongodb://admin:admin_password@mongodb:27017/rd?authSource=admin
      --map_link=/map
    volumes:
      - .:/app
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - rd_network

  # Nginx: entry point for the legacy stack, no CDN - serves /map, /static,
  # /audio straight from disk and reverse-proxies everything else to
  # game-engine/site-server/quick-engine above. Only this service is
  # published to the host; the three backends are reached by their Docker DNS
  # names on the internal network only. The new FastAPI stack (`app`) is
  # unaffected and stays reachable directly on its own published port.
  nginx:
    image: nginx:1.27-alpine
    container_name: rd_nginx
    restart: unless-stopped
    # NGINX_BIND lets a prod .env restrict this to 127.0.0.1 (see
    # docker-compose.prod.yml / nginx_conf/deploy) without needing to
    # override the `ports:` list itself - compose merges port lists across
    # -f files by concatenation, not override, so a second `ports:` entry
    # in an override file would add to this one rather than replace it.
    ports:
      - "${NGINX_BIND:-0.0.0.0}:${NGINX_HTTP_PORT:-8080}:80"
    environment:
      - GAME_ENGINE_HOST=${GAME_ENGINE_HOST:-game-engine}
      - GAME_ENGINE_PORT=${GAME_ENGINE_PORT:-8000}
      - SITE_HOST=${SITE_HOST:-site-server}
      - SITE_PORT=${SITE_PORT:-8001}
      - QUICK_HOST=${QUICK_HOST:-quick-engine}
      - QUICK_PORT=${QUICK_PORT:-8005}
    volumes:
      - ./nginx_conf/templates:/etc/nginx/templates:ro
      - ./sublayers_world/tiles:/srv/world_tiles:ro
      - ./sublayers_common:/srv/static_root:ro
      - ./audio_static:/srv/audio_root:ro
    depends_on:
      - game-engine
      - site-server
      - quick-engine
    networks:
      - rd_network

networks:
  rd_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
