version: '3.8'

services:
  # MongoDB database
  mongodb:
    image: mongo:7.0
    container_name: rd_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password
      MONGO_INITDB_DATABASE: rd
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - rd_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache (for future use)
  redis:
    image: redis:7-alpine
    container_name: rd_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rd_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI application (development)
  app:
    build:
      context: .
      target: development
    container_name: rd_app
    restart: unless-stopped
    environment:
      - MONGODB_URL=mongodb://admin:admin_password@mongodb:27017/rd?authSource=admin
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-change-in-production
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot-reload
      - ./app:/app/app
      - ./sublayers_common:/app/sublayers_common
      - ./tests:/app/tests
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rd_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Nginx reverse proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: rd_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx_conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_conf/conf.d:/etc/nginx/conf.d:ro
      - ./sublayers_common/static:/usr/share/nginx/html/static:ro
      # - ./ssl:/etc/nginx/ssl:ro  # For HTTPS certificates
    depends_on:
      - app
    networks:
      - rd_network
    profiles:
      - production

networks:
  rd_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
